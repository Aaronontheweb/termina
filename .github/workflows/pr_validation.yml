name: pr_validation

on:
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  test:
    name: Test-${{matrix.os}}
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "dotnet build"
        run: dotnet build -c Release

      # .NET Framework tests can't run reliably on Linux, so we only do .NET 8

      - name: "dotnet test"
        shell: bash
        run: dotnet test -c Release 

      - name: "dotnet pack"
        run: dotnet pack -c Release -o ./bin/nuget

  nuget-validation:
    name: NuGet-Validation
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "Create NuGet packages"
        run: dotnet pack -c Release -o ./output

      - name: "Validate NuGet packages"
        shell: bash
        run: |
          echo "=== Checking for NuGet packages ==="
          ls -la ./output/*.nupkg

          echo ""
          echo "=== Validating package contents ==="
          for pkg in ./output/*.nupkg; do
            echo "--- Checking $pkg ---"
            unzip -l "$pkg" | head -50

            # Verify icon is present
            if unzip -l "$pkg" | grep -q "termina-icon.png"; then
              echo "✓ Package icon found"
            else
              echo "✗ Package icon MISSING"
              exit 1
            fi

            # Verify README is present
            if unzip -l "$pkg" | grep -q "README.md"; then
              echo "✓ README found"
            else
              echo "✗ README MISSING"
              exit 1
            fi

            # Verify nuspec has required metadata
            unzip -p "$pkg" "*.nuspec" > /tmp/nuspec.xml

            if grep -q "<description>" /tmp/nuspec.xml; then
              echo "✓ Description found"
            else
              echo "✗ Description MISSING"
              exit 1
            fi

            if grep -q "<licenseUrl>\|<license" /tmp/nuspec.xml; then
              echo "✓ License found"
            else
              echo "✗ License MISSING"
              exit 1
            fi

            echo ""
          done

          echo "=== All NuGet validations passed ==="

  aot-validation:
    name: AOT-${{matrix.runtime}}
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-26
            runtime: osx-arm64

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Restore dependencies"
        run: dotnet restore

      - name: "AOT Publish Demo App"
        # Note: PublishAot=true is set in the project file, which implies PublishTrimmed=true
        # Do NOT pass /p:PublishTrimmed=true on command line as it forces the property onto
        # all referenced projects including netstandard2.0 source generators (SDK bug)
        run: dotnet publish demos/Termina.Demo -c Release -r ${{ matrix.runtime }} --self-contained -o ./publish/${{ matrix.runtime }} /p:TrimmerSingleWarn=false

      - name: "Check AOT warnings (Linux only)"
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'linux-x64'
        run: dotnet publish demos/Termina.Demo -c Release -r linux-x64 --self-contained /p:TrimmerSingleWarn=false /p:TreatWarningsAsErrors=true /warnAsError:IL2026 /warnAsError:IL2057 /warnAsError:IL2067 /warnAsError:IL2075 /warnAsError:IL2096 /warnAsError:IL3050

      - name: "Test AOT binary"
        shell: bash
        timeout-minutes: 1
        run: |
          # Run with --test flag which uses scripted input to test and exit
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            ./publish/${{ matrix.runtime }}/Termina.Demo.exe --test
          else
            ./publish/${{ matrix.runtime }}/Termina.Demo --test
          fi

  docs-validation:
    name: Docs-Build
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: "Install npm dependencies"
        working-directory: docs
        run: npm install

      - name: "Build VitePress site"
        working-directory: docs
        run: npm run build

      - name: "Verify build output"
        run: |
          if [ -d "docs/.vitepress/dist" ]; then
            echo "✓ VitePress build successful"
            ls -la docs/.vitepress/dist
          else
            echo "✗ VitePress build failed - no dist directory"
            exit 1
          fi